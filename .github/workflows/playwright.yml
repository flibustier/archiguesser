name: Playwright Tests
on:
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # The image already holds the browsers and their system libraries: installing
    # them at each run took more than the 15 minutes allowed. It is the image that
    # makes the Linux screenshots (`test:e2e:linux` in package.json): keep its
    # version equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build for preview
        run: pnpm run build
      - name: Run Playwright tests and update snapshots
        if: contains(github.event.pull_request.labels.*.name, 'update snapshots')
        run: pnpm run test:e2e --update-snapshots
      - name: Run Playwright tests
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'update snapshots') }}
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-artifact
          path: |
            playwright-report/
            tests/*-snapshots/
          retention-days: 1
